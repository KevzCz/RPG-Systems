plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
	maven { url 'https://maven.puffish.net' }
	maven { url "https://maven.terraformersmc.com/" }
	maven { url 'https://maven.wispforest.io/releases' }
	maven {
		url "https://maven.ftb.dev/releases"
		content {
			includeGroup "dev.ftb.mods"
		}
	}

	maven {
		url "https://maven.ftb.dev/snapshots"
		content {
			includeGroup "dev.ftb.mods"
		}
	}
	maven {
		name = "Ladysnake Mods"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		url "https://cursemaven.com"
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation("maven.modrinth:spell-engine:1.10.3+1.21.1-fabric")
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation("com.terraformersmc:modmenu:11.0.3")
	modCompileOnly("io.wispforest:accessories-fabric:${project.accessories_version}+1.21.1")
	// Compats
	modCompileOnly files("libs/puffish_skills-0.16.5-1.21-fabric.jar")
	modCompileOnly files("libs/showmeyourbuild-1.0.2.jar")
	modCompileOnly files("libs/mana-attributes-2.7.0.jar")
	modCompileOnly files("libs/stamina-attributes-2.7.0.jar")
	modCompileOnly files("libs/rpgmana-1.2.8-1.21.1.jar")
	modCompileOnly files("libs/icon-leading-tooltip-1.0.2.jar")
	modCompileOnly files("libs/kevs-library-1.5.9.5.jar")

	modCompileOnly "curse.maven:levelz-517130:6181516"
	modCompileOnly("maven.modrinth:tiny-config:${project.tiny_config_version}-fabric")
	modCompileOnly "curse.maven:critical-strike-1379562:7203013"
	modCompileOnly "curse.maven:architectury-api-419699:5786326"
	modCompileOnly("dev.ftb.mods:ftb-library-fabric:${project.ftb_library_version}") { transitive false }
	modCompileOnly("dev.ftb.mods:ftb-teams-fabric:${project.ftb_teams_version}") { transitive false }
	modCompileOnly "curse.maven:partyaddon-862603:6992821"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

publishMods {
    // The per-task dryRun is wired from this and finalized in the task constructor, so it
    // has to be set here. Keyed off the requested task names so publishModsDry rehearses
    // while a plain publishMods still uploads for real.
    dryRun = gradle.startParameter.taskNames.any { it.contains("publishModsDry") }

    file = tasks.remapJar.archiveFile
    displayName = "RPG Systems [FABRIC] [${rootProject.minecraft_version}] - [${project.version}]"
    type = STABLE
    modLoaders.add("fabric")

    def changelogFile = rootProject.file("CHANGELOG.md")
    def changelogText = changelogFile.exists() ? changelogFile.text : ""
    changelog = changelogText.trim().isEmpty() ? "No changelog provided." : changelogText

    curseforge {
        projectId = "1337672"
        accessToken = providers.gradleProperty("cfToken")
            .orElse(providers.environmentVariable("CF_TOKEN"))
        minecraftVersions.add("1.21.1")
        javaVersions.add(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = true
    }

    modrinth {
        projectId = "tnPjKnoo"
        accessToken = providers.gradleProperty("modrinthToken")
            .orElse(providers.environmentVariable("MODRINTH_TOKEN"))
        minecraftVersions.add("1.21.1")
    }
}

// Offline rehearsal: validates the config, writes the jar out and logs the display name,
// version and changelog — without contacting either platform. Replaces the old plugin's
// publishUnifiedToLocal.
//
// The plugin hardcodes its own build/publishMods/<task>/ output and finalizes that path in
// the task constructor, so it cannot be redirected. The jars are collected into
// build/unified-dry/ afterwards instead, giving one predictable place to look.
tasks.register("publishModsDry", Copy) {
    group = "upload"
    description = "Dry run of publishMods — writes to build/unified-dry/ instead of uploading."

    def publishTasks = tasks.withType(me.modmuss50.mpp.PublishModTask)
    dependsOn publishTasks

    from(publishTasks.collect { it.dryRunDirectory }) {
        include "**/*.jar"
    }
    into rootProject.layout.buildDirectory.dir("unified-dry")
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Gradle's built-in "publishing" group also holds the Maven publication tasks, which do
// not upload anywhere. Moving the mod-publishing tasks into their own group keeps the two
// kinds of "publish" apart in the IDE's task tree.
tasks.named("publishMods") { group = "upload" }
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    group = "upload"
}






